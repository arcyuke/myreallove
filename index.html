<body>
  <canvas id="hearts" aria-hidden="true"></canvas>
  <div id="color-wash" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <section id="intro" aria-labelledby="intro-title">
    <div class="intro-content">
      <p class="eyebrow intro-label">ДЛЯ ТЕБЯ. ПРО НАС.</p>
      <h1 id="intro-title" aria-label="История пишется. И мы сами пишем нашу историю."><span id="typed" aria-hidden="true"></span><span class="cursor" aria-hidden="true">▏</span></h1>
      <p class="intro-description">Нажми на кнопку, чтобы посмотреть<br>историю этих милых ребят.</p>
      <button id="open-story" class="primary">Открыть <span aria-hidden="true">↗</span></button>
    </div>
    <div class="intro-bottom"><span>ОЛЕГ + НАСТЯ</span><span>16.03.2025 — ∞</span></div>
  </section>
  <div id="experience" hidden>
    <header class="header">
      <button class="wordmark" id="chapter-menu" aria-haspopup="dialog" aria-label="Открыть главы истории">о<span>♡</span>н <small>наша история</small></button>
      <div class="header-right"><span id="together" class="together"></span><button id="sound" class="sound-button" aria-pressed="false" aria-label="Включить звуки">♫ <span>звук выкл.</span></button></div>
    </header>
    <main id="stage" tabindex="-1"></main>
    <div class="companions" aria-label="Наши пиксельные герои">
      <button id="boy" class="walker boy" aria-label="Позвать Олега"><span class="bubble">Я рядом ♡</span><span class="sprite" aria-hidden="true"></span><span class="walker-shadow" aria-hidden="true"></span></button>
      <button id="girl" class="walker girl" aria-label="Позвать Настю"><span class="bubble">И я ♡</span><span class="sprite" aria-hidden="true"></span><span class="walker-shadow" aria-hidden="true"></span></button>
    </div>
    <footer class="navigation">
      <button id="previous" class="nav-back" aria-label="Предыдущая глава">← <span>Назад</span></button>
      <button id="chapter-progress" class="chapter-progress" aria-haspopup="dialog"><span id="chapter-count">01 / 18</span><span class="progress-track"><i id="progress-fill"></i></span><span id="chapter-name">Знакомство</span></button>
      <button id="next" class="primary nav-next">Дальше <span aria-hidden="true">→</span></button>
    </footer>
  </div>
  <aside id="achievement" class="achievement" role="status" aria-live="polite" aria-atomic="true"><span id="achievement-icon" class="achievement-icon" aria-hidden="true">♥</span><div><small>Достижение получено!</small><strong id="achievement-title"></strong><p id="achievement-text"></p></div></aside>
  <dialog id="chapters-dialog" aria-labelledby="chapters-title"><div class="dialog-top"><p class="eyebrow">НАША ИСТОРИЯ</p><button class="icon-button" data-close aria-label="Закрыть главы">×</button></div><h2 id="chapters-title">К чему вернёмся?</h2><nav id="chapters-list" aria-label="Главы"></nav></dialog>
  <dialog id="lightbox" class="lightbox" aria-label="Просмотр воспоминания"><button class="icon-button lightbox-close" data-close aria-label="Закрыть воспоминание">×</button><div id="lightbox-media"></div><div class="lightbox-bottom"><button id="lightbox-prev" class="icon-button" aria-label="Предыдущее фото">←</button><span id="lightbox-caption"></span><button id="lightbox-next" class="icon-button" aria-label="Следующее фото">→</button></div></dialog>
  <noscript><div class="noscript">Эта история оживает с JavaScript. Включи его в браузере и обнови страницу ♡</div></noscript>
